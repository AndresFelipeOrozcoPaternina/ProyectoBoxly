<text x="1310.0" y="857.68" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#243b53">Reglas y controles del modelo actual</text>
<text x="890.0" y="930.26" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#243b53">1. RN-04: solo el pago aprobado activa la suscripcion.</text>
<text x="890.0" y="956.26" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#243b53">2. Si el pago falla, se registra el motivo y no se descuenta stock.</text>
<text x="890.0" y="982.26" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#243b53">3. Cancelar exige que exista y que no este cancelada.</text>
<text x="890.0" y="1008.26" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#243b53">4. El codigo permite cancelar tambien un pago rechazado.</text>
<text x="890.0" y="1034.26" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#243b53">5. Cancelada no tiene nuevas transiciones en este modelo.</text>
<text x="890.0" y="1060.26" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#243b53">6. Pausada existe en el enum, pero sus funciones faltan.</text>
<text x="890.0" y="1086.26" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#243b53">7. Las condiciones se revisan antes de cambiar el estado.</text>
<text x="1312.5" y="1142.94" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#8a5600">RN-07: el codigo descuenta al aprobar el pago,</text>
<text x="1312.5" y="1167.94" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#8a5600">aunque la regla indica descontar al preparar el envio.</text>
</svg>