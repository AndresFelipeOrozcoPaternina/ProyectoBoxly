<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 800" font-family="Arial, Helvetica, sans-serif">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
    <path d="M0,0 L10,4 L0,8 z" fill="#4B5563"/>
  </marker>
  <marker id="arrow-green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
    <path d="M0,0 L10,4 L0,8 z" fill="#16A34A"/>
  </marker>
  <marker id="arrow-amber" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
    <path d="M0,0 L10,4 L0,8 z" fill="#D97706"/>
  </marker>
  <marker id="arrow-gray" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
    <path d="M0,0 L10,4 L0,8 z" fill="#6B7280"/>
  </marker>
</defs>
<rect width="850" height="800" fill="#ffffff"/>
<ellipse cx="425" cy="55" rx="85.0" ry="24.0" fill="#4F46E5" stroke="#4F46E5" stroke-width="2"/>
<text x="425" y="60" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Inicio</text>
<line x1="425" y1="79" x2="425" y2="120" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="285.0" y="120.0" width="280" height="60" rx="14" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
<text x="425" y="155" text-anchor="middle" font-size="14" fill="#111827">Abrir catálogo general (HU-1.1)</text>
<line x1="425" y1="180" x2="425" y2="230" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="285.0" y="230.0" width="280" height="60" rx="14" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
<text x="425" y="265" text-anchor="middle" font-size="14" fill="#111827">Visualizar cajas disponibles con precio y temática</text>
<line x1="425" y1="290" x2="425" y2="340" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="285.0" y="340.0" width="280" height="60" rx="14" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
<text x="425" y="375" text-anchor="middle" font-size="14" fill="#111827">Aplicar filtro por categoría (HU-1.2)</text>
<line x1="425" y1="400" x2="425" y2="450" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>
<polygon points="425,450.0 545.0,500 425,550.0 305.0,500" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
<text x="425" y="505" text-anchor="middle" font-size="14" fill="#111827">¿Encontró la caja buscada?</text>
<line x1="305" y1="500" x2="230" y2="500" stroke="#D97706" stroke-width="2" marker-end="url(#arrow-amber)"/>
<text x="327" y="488" text-anchor="middle" font-size="13" font-weight="bold" fill="#D97706">No</text>
<rect x="50.0" y="470.0" width="180" height="60" rx="14" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
<text x="140" y="505" text-anchor="middle" font-size="14" fill="#111827">Explorar otra categoría</text>
<polyline points="140,470 140,200 405,200" fill="none" stroke="#6B7280" stroke-width="2"/>
<line x1="405" y1="200" x2="405" y2="228" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow-gray)"/>
<line x1="425" y1="550" x2="425" y2="600" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>
<text x="443" y="580" text-anchor="middle" font-size="13" font-weight="bold" fill="#16A34A">Sí</text>
<rect x="285.0" y="600.0" width="280" height="60" rx="14" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
<text x="425" y="635" text-anchor="middle" font-size="14" fill="#111827">Seleccionar la caja</text>
<line x1="425" y1="660" x2="425" y2="710" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>
<ellipse cx="425" cy="745" rx="85.0" ry="24.0" fill="#111827" stroke="#111827" stroke-width="2"/>
<text x="425" y="750" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Fin (sigue HU-1.3)</text>
</svg>
