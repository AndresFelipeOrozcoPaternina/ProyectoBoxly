<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 900" font-family="Arial, Helvetica, sans-serif">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
    <path d="M0,0 L10,4 L0,8 z" fill="#4B5563"/>
  </marker>
  <marker id="arrow-green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
    <path d="M0,0 L10,4 L0,8 z" fill="#16A34A"/>
  </marker>
  <marker id="arrow-amber" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
    <path d="M0,0 L10,4 L0,8 z" fill="#D97706"/>
  </marker>
  <marker id="arrow-gray" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
    <path d="M0,0 L10,4 L0,8 z" fill="#6B7280"/>
  </marker>
</defs>
<rect width="850" height="900" fill="#ffffff"/>
<ellipse cx="425" cy="55" rx="140.0" ry="24.0" fill="#4F46E5" stroke="#4F46E5" stroke-width="2"/>
<text x="425" y="60" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Inicio (desde el catálogo)</text>
<line x1="425" y1="79" x2="425" y2="120" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="285.0" y="120.0" width="280" height="60" rx="14" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
<text x="425" y="155" text-anchor="middle" font-size="14" fill="#111827">Mostrar detalle de la caja (descripción e inclusión)</text>
<line x1="425" y1="180" x2="425" y2="230" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="285.0" y="230.0" width="280" height="60" rx="14" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
<text x="425" y="265" text-anchor="middle" font-size="14" fill="#111827">Presentar planes disponibles Mensual / Semestral / Anual</text>
<line x1="425" y1="290" x2="425" y2="340" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="285.0" y="340.0" width="280" height="60" rx="14" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
<text x="425" y="375" text-anchor="middle" font-size="14" fill="#111827">Seleccionar plan de suscripción (RN-11)</text>
<line x1="425" y1="400" x2="425" y2="450" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="285.0" y="450.0" width="280" height="60" rx="14" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
<text x="425" y="485" text-anchor="middle" font-size="14" fill="#111827">Calcular valor del plan con descuento aplicado</text>
<line x1="425" y1="510" x2="425" y2="560" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>
<polygon points="425,560.0 545.0,610 425,660.0 305.0,610" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
<text x="425" y="615" text-anchor="middle" font-size="14" fill="#111827">¿Continuar con la suscripción?</text>
<line x1="305" y1="610" x2="230" y2="610" stroke="#D97706" stroke-width="2" marker-end="url(#arrow-amber)"/>
<text x="327" y="598" text-anchor="middle" font-size="13" font-weight="bold" fill="#D97706">No</text>
<rect x="50.0" y="580.0" width="180" height="60" rx="14" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
<text x="140" y="615" text-anchor="middle" font-size="14" fill="#111827">Volver al catálogo</text>
<line x1="140" y1="640" x2="140" y2="720" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>
<ellipse cx="140" cy="755" rx="100.0" ry="24.0" fill="#111827" stroke="#111827" stroke-width="2"/>
<text x="140" y="760" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Fin (retorna al catálogo)</text>
<line x1="425" y1="660" x2="425" y2="710" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>
<text x="443" y="690" text-anchor="middle" font-size="13" font-weight="bold" fill="#16A34A">Sí</text>
<rect x="285.0" y="710.0" width="280" height="60" rx="14" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
<text x="425" y="745" text-anchor="middle" font-size="14" fill="#111827">Continuar a prefacturación (HU-3.1)</text>
<line x1="425" y1="770" x2="425" y2="820" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>
<ellipse cx="425" cy="855" rx="110.0" ry="24.0" fill="#111827" stroke="#111827" stroke-width="2"/>
<text x="425" y="860" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Fin (sigue HU-3.1)</text>
</svg>
