<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 1080" font-family="Arial, Helvetica, sans-serif">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
    <path d="M0,0 L10,4 L0,8 z" fill="#4B5563"/>
  </marker>
  <marker id="arrow-green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
    <path d="M0,0 L10,4 L0,8 z" fill="#16A34A"/>
  </marker>
  <marker id="arrow-amber" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
    <path d="M0,0 L10,4 L0,8 z" fill="#D97706"/>
  </marker>
  <marker id="arrow-gray" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
    <path d="M0,0 L10,4 L0,8 z" fill="#6B7280"/>
  </marker>
</defs>
<rect width="850" height="1080" fill="#ffffff"/>
<ellipse cx="425" cy="55" rx="150.0" ry="24.0" fill="#4F46E5" stroke="#4F46E5" stroke-width="2"/>
<text x="425" y="60" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Inicio (desde la selección del plan)</text>
<line x1="425" y1="79" x2="425" y2="120" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="285.0" y="120.0" width="280" height="60" rx="14" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
<text x="425" y="155" text-anchor="middle" font-size="14" fill="#111827">Validar sesión del usuario (RN-01)</text>
<line x1="425" y1="180" x2="425" y2="230" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="285.0" y="230.0" width="280" height="60" rx="14" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
<text x="425" y="265" text-anchor="middle" font-size="14" fill="#111827">Completar dirección de envío</text>
<line x1="425" y1="290" x2="425" y2="340" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="285.0" y="340.0" width="280" height="60" rx="14" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
<text x="425" y="375" text-anchor="middle" font-size="14" fill="#111827">Elegir método de pago</text>
<line x1="425" y1="400" x2="425" y2="450" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="260.0" y="460.0" width="330" height="70" rx="14" fill="#E0E7FF" stroke="#4338CA" stroke-width="2"/>
<text x="425" y="491" text-anchor="middle" font-size="14" fill="#111827" font-weight="bold">Generar pre-factura automática:</text><text x="425" y="511" text-anchor="middle" font-size="14" fill="#111827" font-weight="bold">valor del plan + costo de envío = total (RN-03)</text>
<line x1="425" y1="530" x2="425" y2="580" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>
<polygon points="425,580.0 545.0,630 425,680.0 305.0,630" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
<text x="425" y="635" text-anchor="middle" font-size="14" fill="#111827">¿Confirma la pre-factura?</text>
<line x1="305" y1="630" x2="230" y2="630" stroke="#D97706" stroke-width="2" marker-end="url(#arrow-amber)"/>
<text x="327" y="618" text-anchor="middle" font-size="13" font-weight="bold" fill="#D97706">No</text>
<rect x="45.0" y="600.0" width="190" height="60" rx="14" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
<text x="140" y="635" text-anchor="middle" font-size="14" fill="#111827">Volver al detalle de la caja</text>
<line x1="140" y1="660" x2="140" y2="740" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>
<ellipse cx="140" cy="775" rx="100.0" ry="24.0" fill="#111827" stroke="#111827" stroke-width="2"/>
<text x="140" y="780" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Fin (retorna al detalle)</text>
<line x1="425" y1="680" x2="425" y2="730" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>
<text x="443" y="710" text-anchor="middle" font-size="13" font-weight="bold" fill="#16A34A">Sí</text>
<rect x="285.0" y="730.0" width="280" height="60" rx="14" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
<text x="425" y="765" text-anchor="middle" font-size="14" fill="#111827">Registrar pago pendiente de validación (RN-04)</text>
<line x1="425" y1="790" x2="425" y2="830" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="285.0" y="830.0" width="280" height="60" rx="14" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
<text x="425" y="865" text-anchor="middle" font-size="14" fill="#111827" font-weight="bold">Activar suscripción</text>
<line x1="425" y1="890" x2="425" y2="930" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="285.0" y="930.0" width="280" height="60" rx="14" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
<text x="425" y="965" text-anchor="middle" font-size="14" fill="#111827">Mostrar la caja como ACTIVA en «Mis cajas»</text>
<line x1="425" y1="990" x2="425" y2="1020" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>
<ellipse cx="425" cy="1050" rx="85.0" ry="24.0" fill="#111827" stroke="#111827" stroke-width="2"/>
<text x="425" y="1055" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Fin</text>
</svg>
