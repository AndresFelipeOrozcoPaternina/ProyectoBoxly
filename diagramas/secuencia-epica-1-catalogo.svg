<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="930" viewBox="0 0 1400 930">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#334155"/></marker>
    <marker id="open" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker>
    <style>
      text{font-family:Arial,sans-serif;fill:#172554}.title{font-size:23px;font-weight:bold}.subtitle{font-size:14px;fill:#334155}.head{fill:#dbeafe;stroke:#3b82f6;stroke-width:1.8}.head2{fill:#ede9fe;stroke:#8b5cf6;stroke-width:1.8}.head3{fill:#fef3c7;stroke:#f59e0b;stroke-width:1.8}.label{font-size:14px;font-weight:bold}.body{font-size:13px}.life{stroke:#64748b;stroke-width:1.5;stroke-dasharray:6 5}.call{stroke:#334155;stroke-width:1.7;marker-end:url(#arrow)}.ret{stroke:#334155;stroke-width:1.5;stroke-dasharray:6 4;marker-end:url(#open)}.frame{fill:none;stroke:#64748b;stroke-width:1.5}.frameHead{fill:#f1f5f9;stroke:#64748b;stroke-width:1.5}.frameLabel{font-size:13px;font-weight:bold}.note{fill:#fef2f2;stroke:#ef4444;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1400" height="930" fill="#fff"/>
  <text class="title" x="30" y="40">ÉPICA 1 — Explorar catálogo y planes</text>
  <text class="subtitle" x="30" y="66">Escenario: filtrar catálogo, consultar detalle y seleccionar plan · RU-01 / RF-05 a RF-09 · HU-1.1, HU-1.2 y HU-1.3 (E2)</text>
  <rect class="head" x="55" y="90" width="190" height="58" rx="8"/><text class="label" x="78" y="116">Usuario</text><text class="body" x="78" y="136">suscriptor</text>
  <rect class="head2" x="340" y="90" width="220" height="58" rx="8"/><text class="label" x="363" y="116">Navegador / DOM</text><text class="body" x="363" y="136">inicio.html y detalle.html</text>
  <rect class="head2" x="700" y="90" width="210" height="58" rx="8"/><text class="label" x="730" y="116">script.js</text><text class="body" x="730" y="136">eventos y presentación</text>
  <rect class="head3" x="1060" y="90" width="235" height="58" rx="8"/><text class="label" x="1083" y="116">Datos JavaScript</text><text class="body" x="1083" y="136">CATALOGO / PLANES</text>
  <line class="life" x1="150" y1="148" x2="150" y2="760"/><line class="life" x1="450" y1="148" x2="450" y2="760"/><line class="life" x1="805" y1="148" x2="805" y2="760"/><line class="life" x1="1178" y1="148" x2="1178" y2="760"/>
  <line class="call" x1="150" y1="180" x2="450" y2="180"/><text class="body" x="205" y="170">1. Abre inicio.html</text>
  <line class="call" x1="450" y1="215" x2="805" y2="215"/><text class="body" x="535" y="205">2. DOMContentLoaded</text>
  <line class="ret" x1="805" y1="250" x2="450" y2="250"/><text class="body" x="520" y="240">3. Registra manejadores de filtros y tarjetas</text>
  <rect class="frame" x="320" y="270" width="1010" height="135"/>
  <path class="frameHead" d="M320 270 h380 v30 h-380 z"/><text class="frameLabel" x="330" y="291">loop [el usuario cambia el filtro de categoría]</text>
  <line class="call" x1="150" y1="325" x2="450" y2="325"/><text class="body" x="202" y="315">4. Clic en categoría</text>
  <line class="call" x1="450" y1="360" x2="805" y2="360"/><text class="body" x="500" y="350">5. click handler: lee data-filter</text>
  <line class="ret" x1="805" y1="385" x2="450" y2="385"/><text class="body" x="495" y="375">6. Filtra tarjetas por categoría y ajusta display</text>
  <line class="call" x1="150" y1="435" x2="450" y2="435"/><text class="body" x="205" y="425">7. Clic en tarjeta</text>
  <line class="call" x1="450" y1="470" x2="805" y2="470"/><text class="body" x="510" y="460">8. Lee data-slug y navega a detalle.html?caja=...</text>
  <line class="call" x1="150" y1="505" x2="450" y2="505"/><text class="body" x="205" y="495">9. Navega a detalle.html</text>
  <line class="call" x1="450" y1="540" x2="805" y2="540"/><text class="body" x="535" y="530">10. DOMContentLoaded; lee query param caja</text>
  <line class="call" x1="805" y1="575" x2="1178" y2="575"/><text class="body" x="880" y="565">11. Busca caja por slug</text>
  <line class="ret" x1="1178" y1="610" x2="805" y2="610"/><text class="body" x="875" y="600">12. Caja local o gamer-ultimate si slug no coincide</text>
  <line class="ret" x1="805" y1="645" x2="450" y2="645"/><text class="body" x="510" y="635">13. Actualiza el DOM con datos de la caja</text>
  <rect class="frame" x="320" y="675" width="1010" height="130"/>
  <path class="frameHead" d="M320 675 h365 v30 h-365 z"/><text class="frameLabel" x="330" y="696">loop [el usuario selecciona otro plan]</text>
  <line class="call" x1="150" y1="735" x2="450" y2="735"/><text class="body" x="205" y="725">14. Cambia opción Mensual / Semestral / Anual</text>
  <line class="call" x1="450" y1="770" x2="805" y2="770"/><text class="body" x="500" y="760">15. change handler: calcularValorPlan(precio, plan)</text>
  <line class="ret" x1="805" y1="790" x2="450" y2="790"/><text class="body" x="500" y="785">16. Actualiza resumen: valor bruto, descuento y total del plan</text>
  <rect class="note" x="45" y="825" width="1285" height="75" rx="8"/>
  <text class="label" x="65" y="851">Alcance real</text>
  <text class="body" x="65" y="876">Este recorrido se ejecuta en el navegador usando datos locales de CATALOGO/PLANES; no consume GET /api/cajas. El botón Continuar lleva a facturación.html y el checkout se documenta en la secuencia de RU-03.</text>
</svg>
