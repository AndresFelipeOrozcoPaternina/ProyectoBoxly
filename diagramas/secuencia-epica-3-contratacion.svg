<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1290" viewBox="0 0 1800 1290">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#334155"/></marker>
    <marker id="open" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker>
    <style>
      text{font-family:Arial,sans-serif;fill:#172554}.title{font-size:23px;font-weight:bold}.subtitle{font-size:14px;fill:#334155}.head{fill:#dbeafe;stroke:#3b82f6;stroke-width:1.8}.app{fill:#ede9fe;stroke:#8b5cf6;stroke-width:1.8}.repo{fill:#fef3c7;stroke:#f59e0b;stroke-width:1.8}.pattern{fill:#fff7ed;stroke:#f97316;stroke-width:1.8}.observer{fill:#ecfccb;stroke:#84cc16;stroke-width:1.8}.label{font-size:13px;font-weight:bold}.body{font-size:12px}.life{stroke:#64748b;stroke-width:1.4;stroke-dasharray:6 5}.call{stroke:#334155;stroke-width:1.6;marker-end:url(#arrow)}.ret{stroke:#334155;stroke-width:1.4;stroke-dasharray:6 4;marker-end:url(#open)}.frame{fill:none;stroke:#64748b;stroke-width:1.5}.frameHead{fill:#f1f5f9;stroke:#64748b;stroke-width:1.5}.frameLabel{font-size:12px;font-weight:bold}.divider{stroke:#64748b;stroke-width:1.3}.note{fill:#fef2f2;stroke:#ef4444;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1800" height="1220" fill="#fff"/>
  <text class="title" x="30" y="38">ÉPICA 3 — Gestión de pre-facturación · Contratar una caja (HU-3.1 / RF-10, RF-11 / RN-03, RN-04)</text>
  <text class="subtitle" x="30" y="63">Escenario: pago aprobado y respuestas alternativas de validación, caja inexistente, stock agotado o pago rechazado.</text>
  <rect class="head" x="35" y="85" width="150" height="62" rx="8"/><text class="label" x="58" y="110">Usuario</text><text class="body" x="58" y="130">suscriptor</text>
  <rect class="app" x="220" y="85" width="190" height="62" rx="8"/><text class="label" x="240" y="110">Frontend</text><text class="body" x="240" y="130">script.js / checkout</text>
  <rect class="app" x="435" y="85" width="190" height="62" rx="8"/><text class="label" x="455" y="110">Suscripciones</text><text class="body" x="455" y="130">Controller</text>
  <rect class="app" x="650" y="85" width="200" height="62" rx="8"/><text class="label" x="670" y="110">SuscripcionService</text><text class="body" x="670" y="130">dominio / coordinación</text>
  <rect class="repo" x="875" y="85" width="205" height="62" rx="8"/><text class="label" x="895" y="110">Repositorios en memoria</text><text class="body" x="895" y="130">cajas / suscripciones</text>
  <rect class="pattern" x="1105" y="85" width="205" height="62" rx="8"/><text class="label" x="1125" y="110">FacturacionFacade</text><text class="body" x="1125" y="130">prefactura / pago simulado</text>
  <rect class="pattern" x="1335" y="85" width="180" height="62" rx="8"/><text class="label" x="1355" y="110">PlanFactory</text><text class="body" x="1355" y="130">planes / descuentos</text>
  <rect class="observer" x="1540" y="85" width="220" height="62" rx="8"/><text class="label" x="1560" y="110">SuscripcionNotifier</text><text class="body" x="1560" y="130">observadores / logs</text>
  <line class="life" x1="110" y1="147" x2="110" y2="1180"/><line class="life" x1="315" y1="147" x2="315" y2="1180"/><line class="life" x1="530" y1="147" x2="530" y2="1180"/><line class="life" x1="750" y1="147" x2="750" y2="1180"/><line class="life" x1="978" y1="147" x2="978" y2="1180"/><line class="life" x1="1208" y1="147" x2="1208" y2="1180"/><line class="life" x1="1425" y1="147" x2="1425" y2="1180"/><line class="life" x1="1650" y1="147" x2="1650" y2="1180"/>
  <line class="call" x1="110" y1="180" x2="315" y2="180"/><text class="body" x="145" y="171">1. Confirma formulario</text>
  <line class="call" x1="315" y1="212" x2="315" y2="212"/><text class="body" x="325" y="208">2. checkValidity()</text>
  <rect class="frame" x="205" y="225" width="445" height="82"/><path class="frameHead" d="M205 225 h260 v25 h-260 z"/><text class="frameLabel" x="215" y="243">alt [validación del formulario]</text>
  <text class="body" x="220" y="270">[inválido] reportValidity(); no envía petición</text><text class="body" x="220" y="290">[válido] continúa con el envío</text>
  <line class="call" x1="315" y1="330" x2="530" y2="330"/><text class="body" x="350" y="320">3. POST /api/suscripciones + JSON</text>
  <line class="call" x1="530" y1="362" x2="530" y2="362"/><text class="body" x="540" y="358">4. ModelState / DataAnnotations</text>
  <rect class="frame" x="420" y="375" width="230" height="58"/><path class="frameHead" d="M420 375 h230 v25 h-230 z"/><text class="frameLabel" x="430" y="393">alt [DTO inválido]</text>
  <line class="ret" x1="530" y1="414" x2="315" y2="414"/><text class="body" x="380" y="407">400 + errores</text>
  <line class="call" x1="530" y1="450" x2="750" y2="450"/><text class="body" x="565" y="440">5. CrearSuscripcionAsync(dto)</text>
  <line class="call" x1="750" y1="482" x2="978" y2="482"/><text class="body" x="785" y="472">6. ObtenerPorSlugAsync(slug)</text>
  <line class="ret" x1="978" y1="514" x2="750" y2="514"/><text class="body" x="820" y="504">Caja / null + stock</text>
  <rect class="frame" x="635" y="530" width="1135" height="130"/><path class="frameHead" d="M635 530 h360 v25 h-360 z"/><text class="frameLabel" x="645" y="548">alt [existencia y disponibilidad de la caja]</text>
  <text class="body" x="660" y="577">[no existe] service fallo → Controller 404 → Frontend muestra error</text>
  <line class="divider" x1="635" y1="592" x2="1770" y2="592"/>
  <text class="body" x="660" y="615">[stock agotado] service fallo → Controller 409 → Frontend muestra error</text>
  <line class="divider" x1="635" y1="628" x2="1770" y2="628"/>
  <text class="body" x="660" y="650">[caja existente y stock disponible] continúa el flujo principal</text>
  <line class="call" x1="750" y1="690" x2="1208" y2="690"/><text class="body" x="865" y="680">7. LiquidarPreFactura(caja, tipoPlan)</text>
  <line class="call" x1="1208" y1="720" x2="1425" y2="720"/><text class="body" x="1245" y="710">8. Crear(tipoPlan, precio)</text>
  <line class="ret" x1="1425" y1="750" x2="1208" y2="750"/><text class="body" x="1260" y="740">9. Plan calculado</text>
  <line class="ret" x1="1208" y1="780" x2="750" y2="780"/><text class="body" x="865" y="770">10. Prefactura (plan + envío; RN-03)</text>
  <line class="call" x1="750" y1="810" x2="1208" y2="810"/><text class="body" x="865" y="800">11. ProcesarPagoSimulado(suscripción, dto)</text>
  <rect class="frame" x="635" y="830" width="1135" height="340"/><path class="frameHead" d="M635 830 h300 v25 h-300 z"/><text class="frameLabel" x="645" y="848">alt [resultado del pago]</text>
  <text class="body" x="660" y="877">[rechazado] estado PagoRechazado + motivo (RN-04); no descuenta stock</text>
  <line class="call" x1="750" y1="895" x2="978" y2="895"/><text class="body" x="790" y="887">12a. Guarda suscripción rechazada</text>
  <line class="call" x1="750" y1="920" x2="1650" y2="920"/><text class="body" x="1040" y="912">13a. Notifica cambio (logs)</text>
  <line class="ret" x1="750" y1="945" x2="530" y2="945"/><text class="body" x="560" y="937">14a. Resultado rechazado</text>
  <line class="ret" x1="530" y1="970" x2="315" y2="970"/><text class="body" x="345" y="962">15a. HTTP 422; alerta, sin guardar activa</text>
  <line class="divider" x1="635" y1="990" x2="1770" y2="990"/>
  <text class="body" x="660" y="1015">[aprobado] estado Activa + fecha; descuenta stock; guarda suscripción</text>
  <line class="call" x1="750" y1="1040" x2="978" y2="1040"/><text class="body" x="790" y="1032">12b. Guarda suscripción activa</text>
  <line class="call" x1="750" y1="1065" x2="1650" y2="1065"/><text class="body" x="1040" y="1057">13b. Notifica cambio (logs)</text>
  <line class="ret" x1="750" y1="1090" x2="530" y2="1090"/><text class="body" x="560" y="1082">14b. Resultado exitoso</text>
  <line class="ret" x1="530" y1="1115" x2="315" y2="1115"/><text class="body" x="345" y="1107">15b. HTTP 201 Created</text>
  <line class="call" x1="315" y1="1140" x2="110" y2="1140"/><text class="body" x="125" y="1132">16b. Guarda localStorage; redirige a cajas.html</text>
  <rect class="note" x="35" y="1190" width="1725" height="80" rx="8"/>
  <text class="label" x="55" y="1218">Alcance</text>
  <text class="body" x="55" y="1242">Para 400/404/409 el frontend muestra el error. En excepción de red, el catch usa el respaldo local. El pago y los logs de notificación son simulados;</text>
  <text class="body" x="55" y="1262">el API y localStorage no constituyen una base persistente compartida entre navegador y servidor.</text>
</svg>
