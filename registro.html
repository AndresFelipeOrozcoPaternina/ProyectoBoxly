<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boxly - Crear cuenta</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body class="pagina-login">
    <header>
        <h1>Boxly - Crear cuenta</h1>
        <nav>
            <a href="inicio.html">Volver al Inicio</a>
        </nav>
    </header>
    <hr>

    <main>
        <h2>Registro</h2>

        <form action="login.html">
            <div>
                <label for="nombre">Nombre completo:</label><br>
                <input type="text" id="nombre" required>
            </div>
            <br>
            <div>
                <label for="correo">Correo electrónico:</label><br>
                <input type="email" id="correo" required>
            </div>
            <br>
            <div>
                <label for="passwordRegistro">Contraseña:</label><br>
                <input type="password" id="passwordRegistro" required>
            </div>
            <br>
            <div>
                <label for="passwordConfirmacion">Confirmar contraseña:</label><br>
                <input type="password" id="passwordConfirmacion" required>
            </div>
            <br>
            <button type="submit">Crear cuenta</button>

            <span class="form-link">
                ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
            </span>
        </form>
    </main>
</body>
</html>
